name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v0.0.5"
        required: true

permissions:
  contents: write

jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${{ inputs.tag || github.ref_name }} is not on main; refusing to release."
            exit 1
          fi

  test:
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: bash tests/run_all.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Package per-language artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          for d in C Flutter Javascript go java python; do
            lang=$(echo "$d" | tr '[:upper:]' '[:lower:]')
            zip -r "dist/vietqr-${lang}-${TAG}.zip" "$d" README.md \
              -x '*/__pycache__/*' '*/*_test.go' '*.pyc' '.DS_Store'
          done
          git archive --format=tar.gz --prefix="vietqr-${TAG}/" -o "dist/vietqr-${TAG}-source.tar.gz" "$TAG"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
